<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClubPay</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #1a1a1a; }
nav { background: #1a1a1a; color: white; padding: 12px 24px; display: flex; align-items: center; gap: 24px; }
nav a { color: #ccc; text-decoration: none; font-size: 14px; }
nav a:hover { color: white; }
nav .brand { color: white; font-weight: 600; font-size: 16px; margin-right: 8px; }
.container { max-width: 1300px; margin: 0 auto; padding: 24px; }
.card { background: white; border-radius: 10px; border: 1px solid #e5e5e5; padding: 20px; margin-bottom: 16px; }
.card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 7px; border: 1px solid #ddd; background: white; font-size: 13px; cursor: pointer; text-decoration: none; color: #1a1a1a; transition: all 0.15s; }
.btn:hover { background: #f5f5f5; }
.btn-primary { background: #1a1a1a; color: white; border-color: #1a1a1a; }
.btn-primary:hover { background: #333; }
.btn-danger { background: #dc2626; color: white; border-color: #dc2626; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
input, select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
input:focus, select:focus { outline: none; border-color: #1a1a1a; }
label { font-size: 13px; color: #555; margin-bottom: 4px; display: block; }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 10px; border-bottom: 2px solid #e5e5e5; font-weight: 600; color: #555; font-size: 12px; }
td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; }
tr:hover td { background: #fafafa; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.badge-green { background: #dcfce7; color: #166534; }
.badge-gray { background: #f3f4f6; color: #6b7280; }
.badge-blue { background: #dbeafe; color: #1e40af; }
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 600; }
</style>
</head>
<body>
<nav>
  <a href="/" class="brand">ClubPay</a>
  <a href="/clubs">Клубы</a>
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
</body>
</html>
